<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A3DB3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decreta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Decreta · Práctica diaria de metafísica</title>
<meta name="description" content="Decretos, oraciones y herramientas para practicar metafísica cada día.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: app de una columna para móvil, barra inferior fija; violeta y oro */
:root{
  --bg:#F4F1F9; --surface:#FFFFFF; --sunk:#EAE4F3; --ink:#221A35; --muted:#6B6280;
  --line:#DDD5EA; --violet:#6A3DB3; --violet-soft:#EFE7FB; --gold:#A87A1F; --gold-soft:#F7EED9;
  --ok:#2F8A5B;
  --display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --body:"Nunito Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130F1D; --surface:#1D1730; --sunk:#251E3B; --ink:#EEE8F8; --muted:#A79DC0;
  --line:#33294D; --violet:#B497F0; --violet-soft:#2A2147; --gold:#E3BC63; --gold-soft:#2E2618; --ok:#6CC596; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F1D; --surface:#1D1730; --sunk:#251E3B; --ink:#EEE8F8; --muted:#A79DC0;
  --line:#33294D; --violet:#B497F0; --violet-soft:#2A2147; --gold:#E3BC63; --gold-soft:#2E2618; --ok:#6CC596; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.4rem;line-height:1.2}
h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.small{font-size:.9rem}
.quote{font-family:var(--display);font-size:1.25rem;line-height:1.4}
.decree{font-family:var(--display);font-size:1.22rem;line-height:1.5;white-space:pre-line}
.texto p+p{margin-top:.8em}
.texto{white-space:normal}

/* Botón principal */
.big-no{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:18px;
  background:var(--violet);color:#fff}
:root[data-theme="dark"] .big-no{color:#170F28}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big-no{color:#170F28}}
.big-no .flame{flex:none;width:46px;height:46px}
.big-no b{font-family:var(--display);font-weight:400;font-size:1.45rem;display:block;line-height:1.1}
.big-no span{font-size:.9rem;opacity:.85}

/* Cualidad del día */
.ray{position:relative;overflow:hidden;padding-left:22px}
.ray::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--ray)}
.ray dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:.92rem}
.ray dt{color:var(--muted)} .ray dd{margin:0}

/* Rutina */
.routine-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.check.on{background:var(--violet);border-color:var(--violet)}
.check.on::after{content:"";width:9px;height:15px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.item .lbl{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.item .lbl small{display:block;color:var(--muted);font-size:.82rem}
.item.done .lbl{color:var(--muted)}

/* chips y listas */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sit{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;min-height:92px;display:flex;flex-direction:column;gap:4px}
.sit b{font-weight:700;line-height:1.25}
.sit small{color:var(--muted);font-size:.82rem;line-height:1.3}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--surface)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.full{width:100%}
input[type=text],input[type=date],input[type=time],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--muted)}

.dec{border-bottom:1px solid var(--line);padding:14px 0}
.dec-h{display:flex;gap:10px;align-items:flex-start}
.dec-h button.t{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0}
.dec-h .t b{display:block;font-weight:700}
.dec-h .t small{color:var(--muted);font-size:.8rem}
.star{border:0;background:none;font-size:1.35rem;line-height:1;color:var(--muted);padding:2px 4px}
.star.on{color:var(--gold)}
.dec .body{margin-top:12px;padding:14px;background:var(--sunk);border-radius:12px}

/* Hoja (modal) */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,6,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-18px;background:var(--bg);padding-top:4px;padding-bottom:8px;z-index:1}
.x{border:0;background:var(--sunk);border-radius:50%;width:38px;height:38px;font-size:1.2rem;flex:none}

.step{border-left:2px solid var(--line);padding:0 0 18px 18px;position:relative}
.step::before{content:attr(data-n);position:absolute;left:-14px;top:0;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--violet);color:var(--violet);font-size:.8rem;font-weight:700;display:grid;place-items:center}
.step.last{border-left-color:transparent}
.say{font-family:var(--display);font-size:2rem;color:var(--violet);line-height:1.1}
.note{background:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.93rem}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:40}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:6px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--violet);font-weight:700}
nav.tabs button.center svg{width:30px;height:30px}

/* meditación */
.orb{width:min(70vw,260px);aspect-ratio:1;border-radius:50%;margin:10px auto;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 45%, var(--gold-soft), var(--violet-soft) 70%);border:2px solid var(--line);position:relative}
.orb .n{font-family:var(--display);font-size:3rem;font-variant-numeric:tabular-nums}
.orb.breath{animation:br 6s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.orb.breath{animation:none}}
.phase{display:flex;gap:6px;justify-content:center}
.phase i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.phase i.on{background:var(--violet)}

.wish{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.wish:first-child{border-top:0}
.wish p{flex:1;min-width:0}
.wish.done p{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:.85rem;padding:4px}
.tile{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-weight:700}
.tile small{color:var(--muted);font-size:.84rem;display:block}
.tile .arr{color:var(--muted);flex:none}
.num{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.num:first-child{border-top:0}
.num .v{font-family:var(--display);font-size:2rem;color:var(--violet);text-align:center;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:60;max-width:90vw;text-align:center}
.counter{font-family:var(--display);font-size:2.4rem;color:var(--violet);font-variant-numeric:tabular-nums;line-height:1}
.hr{height:1px;background:var(--line)}
.mood{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mood button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mood button i{width:14px;height:14px;border-radius:50%;display:block}
.mood button b{font-size:.86rem;line-height:1.15}
.mood button small{font-size:.7rem;color:var(--muted);line-height:1.2}
.mood button.on{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet) inset}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--muted)}
.week span i{display:block;width:16px;height:16px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.m-paz{background:#3E9E6A}.m-prisa{background:#D9A62B}.m-temor{background:#7B4FC4}.m-bajo{background:#5A6FA8}
.banner{display:flex;gap:12px;align-items:center;background:var(--gold-soft);border-radius:var(--r);padding:12px 14px}
.banner p{flex:1;min-width:0;font-size:.95rem}
details.why{background:var(--violet-soft);border-radius:12px;padding:10px 14px}
details.why summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--violet)}
details.why p{margin-top:8px;font-size:.93rem}
details.gl{border-top:1px solid var(--line);padding:12px 0}
details.gl:first-child{border-top:0}
details.gl summary{cursor:pointer;list-style:none}
details.gl summary::-webkit-details-marker{display:none}
details.gl summary b{display:block}
details.gl summary small{color:var(--muted);font-size:.84rem}
details.gl .texto{margin-top:10px;font-size:.95rem}
.pract{margin-top:10px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 10px 10px 0;font-size:.92rem}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-family:var(--body);font-size:.9rem}
.share a,.share button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.88rem}
details.ctx{background:var(--violet-soft);border-radius:var(--r);padding:12px 14px}
details.ctx summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--violet)}
details.ctx summary span::after{content:" ▾"}
details.ctx[open] summary span::after{content:" ▴"}
details.ctx summary b{font-weight:700}
details.ctx .texto{margin-top:10px;font-size:.95rem}
.dctx{display:grid;gap:8px;font-size:.92rem;font-family:var(--body);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.dctx b{color:var(--violet)}
.vrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-family:var(--body)}
.vbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.88rem;color:var(--ink)}
.vbtn.play{background:var(--violet);border-color:var(--violet);color:var(--surface)}
.vbtn.rec{color:#B8323F}
.vbtn.rec.on{background:#B8323F;color:#fff;border-color:#B8323F}
#player{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:45;padding-inline:12px}
#player .in{display:flex;align-items:center;gap:10px;width:100%;max-width:616px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px}
#player .in p{flex:1;min-width:0;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;background:var(--bg);color:var(--ink)}
.curso{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.curso:first-of-type{border-top:0}
.npos{border-top:1px solid var(--line);padding:16px 0}
.npos:first-child{border-top:0;padding-top:4px}
.npos .hd{display:flex;gap:14px;align-items:center}
.npos .v{font-family:var(--display);font-size:2.4rem;color:var(--violet);line-height:1;min-width:52px;text-align:center}
.three{display:grid;gap:6px;margin-top:8px;font-size:.9rem}
.three p b{display:inline-block;min-width:96px}
.theme-t{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem}
</style>
</head>
<body>


<main id="app"></main>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>
<div id="player" hidden></div>

<script>
// Decreta · contenido original. Citas bíblicas: Reina-Valera 1909 (dominio público).

window.FORMULA = {
  recordar: "Antes de nada, recuerda quién eres. Tu verdadero ser, el YO SOY que vive en ti, no se enferma, no envejece, no tiene miedo y no carece de nada. Lo que estás viviendo ahora es una apariencia pasajera, no tu verdad. Tu verdad es luz, paz, salud y abundancia.",
  noacepto: "No hace falta gritar ni apretar los dientes. Dilo con tranquilidad y seguridad, como quien rechaza algo que no ha pedido: sin enfado y sin miedo, pero sin dudar.",
  despues: "Una vez hecho, cuida lo que piensas y lo que dices. No vuelvas a describir el problema ni a dudar de lo que declaraste: cada vez que lo cuentas, le devuelves la fuerza que le acabas de quitar.",
  yaEnMarcha: "LO QUE DECLARÉ YA ESTÁ OBRANDO. LO SUELTO CON CONFIANZA Y DOY LAS GRACIAS."
};

window.SITUACIONES = [
  { id:"enfermedad", titulo:"Enfermedad o malestar", sub:"Propia o de alguien querido", verdad:"Vida y salud",
    decreto:"Esta molestia no es la verdad de mi cuerpo. La Vida que me sostiene es sana, sabia y fuerte, y cada célula de mi cuerpo la conoce. YO SOY vida en orden. YO SOY salud que se renueva ahora mismo. Bendigo mi cuerpo y lo devuelvo a su armonía.",
    extra:["Si es por otra persona, di su nombre: “La Vida en [nombre] es sana y fuerte. Su cuerpo recuerda su armonía.”",
      "Seguir el tratamiento médico no va en contra de esta práctica. Bendice al médico, la medicina y a quien te cuida: también son caminos por los que llega el bien."] },
  { id:"temor", titulo:"Miedo", sub:"Propio o de alguien", verdad:"Fe y confianza",
    decreto:"El miedo no viene de Dios y no tiene raíz en mí. Lo miro, le doy las gracias por avisarme y lo dejo marchar. Pertenezco a un Amor que me cuida. YO SOY confianza tranquila. Donde estoy yo, está Dios, y donde está Dios no falta nada.",
    extra:["Dilo aunque te tiemble la voz. Precisamente entonces es cuando más sirve.",
      "“En amor no hay temor; mas el perfecto amor echa fuera el temor” (1 Juan 4:18)."] },
  { id:"tristeza", titulo:"Tristeza o desánimo", sub:"Pena, bajón", verdad:"Alegría",
    decreto:"Esta tristeza es una nube, no es el cielo. Detrás de ella mi alegría sigue intacta. YO SOY alegría que vuelve. YO SOY luz que se abre paso. Hoy elijo mirar lo que sí tengo, y empiezo a nombrarlo ahora mismo.",
    enumerar:true,
    extra:["La gratitud cambia el ánimo más rápido que cualquier razonamiento. Empieza por lo pequeño: el agua caliente, una voz conocida, tus propias manos."] },
  { id:"escasez", titulo:"Falta de dinero", sub:"Deudas, aprieto", verdad:"Abundancia",
    decreto:"La escasez es una apariencia, no mi destino. Vivo en un universo generoso que nunca se queda sin recursos. YO SOY un canal abierto para el bien. El dinero llega a mí por caminos conocidos y por caminos nuevos, en armonía con todos. Hoy tengo lo que necesito, y mañana también.",
    extra:["Bendice cada pago que haces: “Que esto vuelva multiplicado a quien lo recibe y a mí”.",
      "Deja de decir “no me alcanza” o “no hay dinero”. Di: “Todavía no lo veo, pero ya viene”."] },
  { id:"inarmonia", titulo:"Discusión o conflicto", sub:"Pelea, tensión, choque", verdad:"Armonía",
    decreto:"En el fondo de esta situación hay paz, aunque ahora no la vea. La misma Vida que está en mí está en la otra persona, y no puede pelearse consigo misma. YO SOY armonía. Bendigo a quien tengo enfrente y bendigo la solución que ya existe.",
    extra:["Antes de responder, respira tres veces y di por dentro: “Bendigo la salida que todavía no veo”."] },
  { id:"falta", titulo:"Necesito algo ahora", sub:"Una solución, un objeto, una idea", verdad:"Provisión",
    decreto:"Lo que necesito ya existe y ya viene hacia mí. No me falta nada que de verdad me corresponda. YO SOY apertura a la respuesta justa, en el momento justo.",
    extra:["Después, deja de buscar con ansiedad. La respuesta suele aparecer cuando sueltas: una idea, una llamada, alguien que te lo ofrece."] },
  { id:"perdido", titulo:"Perdí algo", sub:"Extravío o robo", verdad:"Lo mío vuelve",
    decreto:"Nada de lo que me pertenece de verdad puede perderse. Lo que es mío vuelve a mí, o llega algo igual o mejor. YO SOY orden, y en el orden todo está en su sitio.",
    extra:["Quédate con calma y no repitas la historia de la pérdida. Cuando aparezca, vuelve a dar las gracias."] },
  { id:"resentimiento", titulo:"Rencor hacia alguien", sub:"Resentimiento, ganas de devolverla", verdad:"Libertad",
    decreto:"Piensa a propósito en algo bueno de esa persona: un gesto amable, un momento compartido, algo que te hizo reír. No tienes que justificar lo que hizo. Solo te estás devolviendo la paz a ti.",
    recordar:true,
    extra:["“Te dejo ir en paz. Lo que pasó ya no me ata. Al soltarte a ti, me suelto yo.”",
      "No hace falta sentir cariño todavía. Basta con la intención de soltar.",
      "Si el rencor vuelve, repite el ejercicio. Cada vez pesa menos."] },
  { id:"dano", titulo:"Alguien me hace daño", sub:"Ataque, injusticia", verdad:"Protección",
    decreto:"Me rodeo de luz, y nada que venga a dañarme puede atravesarla. Le hablo a lo mejor que hay en esta persona: sé que en el fondo es capaz de justicia y de bondad, y eso es lo que llamo ahora. YO SOY paz protegida.",
    extra:["Perdonar no es permitir. Pon límites con calma y defiende lo tuyo sin violencia.",

 {id:"salmo91", cat:"Oraciones", t:"Salmo 91", f:"Reina-Valera 1909",

<script>
(function(){

const now=new Date();

const TODAY=ymd(now);
const doy=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);
function weekKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-S"+Math.ceil(((t-y)/864e5+1)/7);}

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

const FLAME='<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 4c3 8 12 12 12 24a12 12 0 0 1-24 0c0-6 3-9 5-12 1 4 3 6 5 6-1-7 0-13 2-18z" fill="currentColor" opacity=".9"/><path d="M24 26c2 3 5 5 5 9a5 5 0 0 1-10 0c0-3 2-5 5-9z" fill="currentColor" opacity=".45"/></svg>';

 hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>',
 acepto:'<svg viewBox="0 0 48 48" fill="none"><path d="M24 4c3 8 12 12 12 24a12 12 0 0 1-24 0c0-6 3-9 5-12 1 4 3 6 5 6-1-7 0-13 2-18z" fill="currentColor"/></svg>',
 decretos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h10l4 4v12H5z"/><path d="M8 11h8M8 14.5h8M8 18h5"/></svg>',
 herr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-4.4-7-10.2A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7 2.8C19 16.6 12 21 12 21z"/></svg>',
 estudio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1V19c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6.5V20"/></svg>'

const ROUTINE={

  "Noche":[
    {k:"lista-n",t:"Leer mi lista de deseos",s:"Antes de dormir",go:"wishes"},{k:"soltar",d:"soltar"},
    {k:"perdonar",d:"perdonar"},{k:"casa",d:"casa"},{k:"sueno",d:"sueno"}]

function checkin(){
  const today=(S.mood[TODAY]||[]); const last=today[today.length-1];
  const days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const k=ymd(d);const m=S.mood[k]||[];days.push({l:d.toLocaleDateString("es-ES",{weekday:"narrow"}),m:m[m.length-1]});}
  return `<section class="stack" style="gap:10px"><span class="eyebrow">¿Cómo estás ahora?</span>
   <div class="mood">${CHECKIN.map(c=>`<button data-mood="${c.k}" class="${last===c.k?"on":""}"><i class="m-${c.k}"></i><b>${c.t}</b><small>${c.s}</small></button>`).join("")}</div>
   <div class="week" aria-label="Tu semana">${days.map(d=>`<span>${d.l}<i class="${d.m?"m-"+d.m:""}"></i></span>`).join("")}</div></section>`;
}
function banner(){
  const h=now.getHours(); const dis=S.dismiss[TODAY]||[];
  let b=null;
  if(h>=12&&h<16&&!dis.includes("med")&&!day().done.includes("corazon")) b={k:"med",t:"Es mediodía. ¿Te regalas un minuto de pausa del corazón?",go:"latido",l:"Ir"};
  else if(h>=17&&h<22&&!dis.includes("pal")) b={k:"pal",t:"¿Has cuidado tus palabras hoy? Mira si se te ha escapado alguna frase negativa.",go:"palabra",l:"Ver"};
  if(!b) return "";
  return `<div class="banner"><p>${esc(b.t)}</p><button class="btn primary" data-tool="${b.go}">${b.l}</button><button class="del" data-dismiss="${b.k}" aria-label="Ocultar aviso">×</button></div>`;
}
function greeting(){const h=now.getHours();return h<13?"Buenos días":h<20?"Buenas tardes":"Buenas noches";}
function viewHoy(){
  const r=DIAS[now.getDay()], dd=day();
  const fecha=now.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  const lect=LECTURAS[doy%LECTURAS.length];
  let rout="";
  for(const [sec,items] of Object.entries(ROUTINE)){
    const done=items.filter(i=>dd.done.includes(i.k)).length;

      items.map(i=>{const dec=i.d?D(i.d):null;const t=i.t||dec.t;const on=dd.done.includes(i.k);
        return `<div class="item ${on?"done":""}"><button class="check ${on?"on":""}" data-chk="${i.k}" aria-label="Marcar ${esc(t)}"></button>
        <button class="lbl" data-open-r="${i.k}">${esc(t)}${i.s?`<small>${esc(i.s)}</small>`:""}</button></div>`}).join("")+`</section>`;
  }
  const negs=(S.neg[TODAY]||0);
  return `<div class="stack-lg">
   <header class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(fecha)}</span>
     <button class="theme-t" id="theme">${S.theme==="dark"?"Modo claro":S.theme==="light"?"Modo del sistema":"Modo oscuro"}</button></div>
     <h1>${greeting()}${S.name?", "+esc(S.name):""}</h1></header>
   ${ctxBox("hoy")}
   ${checkin()}
   ${banner()}
   <button class="big-no" data-tab="acepto"><span class="flame">${FLAME}</span><span><b>Esto no es para mí</b><span>Algo negativo ahora mismo. Transfórmalo en 4 pasos.</span></span></button>
   <section class="card ray" style="--ray:${r.hex}">
     <span class="eyebrow">Cualidad del ${r.dia.toLowerCase()}</span>
     <h2 style="margin-top:4px">${esc(r.q)}</h2>
     <p class="small" style="margin-top:6px">${esc(r.x)}</p>
     <p class="decree" style="margin-top:10px;font-size:1.05rem">${esc(r.d)}</p>
     <div class="vrow">${sayBtn("dia:"+now.getDay())}</div>
   </section>
   <section class="stack" style="gap:8px"><span class="eyebrow">Para hoy</span><p class="quote">${esc(lect)}</p></section>
   ${cursoCard()}
   ${rout}
   <section class="card row" style="justify-content:space-between">
     <div><span class="eyebrow">Cuidar la palabra</span><p class="small muted" style="margin-top:4px">Frases que hoy corregiste a tiempo</p></div>
     <div class="row"><span class="counter" style="color:var(--ok)">${negs}</span><button class="btn" data-sit="negativo">Corregí una</button></div>
   </section>
  </div>`;
}

function viewAcepto(){
  return `<div class="stack-lg">
   <header class="stack" style="gap:8px"><span class="eyebrow">Soltar y declarar</span><h1>Transformar</h1>
   <p class="muted">Cuando pase algo que no quieres, elige qué está pasando. Te llevo paso a paso.</p></header>

   <div class="grid2">${SITUACIONES.map(s=>`<button class="sit" data-sit="${s.id}"><b>${esc(s.titulo)}</b><small>${esc(s.sub)}</small></button>`).join("")}</div>

const THANKS="Gracias, Padre, porque ya está hecho.";
function openSit(id,forceNew){
  sheetKey=null;
  const s=SITUACIONES.find(x=>x.id===id); let step=1;
  const enCurso=!s.registra&&id!=="recaida"&&S.curso.find(x=>x.sit===id);
  if(enCurso&&!forceNew){showCurso(enCurso);return;}
  const draw=()=>{
    const steps=[
     `<div class="step" data-n="1"><span class="eyebrow">Recuerda</span><p style="margin-top:6px">${esc(FORMULA.recordar)}</p></div>`,
     `<div class="step" data-n="2"><span class="eyebrow">Di, por dentro o en voz alta</span><p class="say" style="margin:8px 0">ESTO NO ES PARA MÍ</p><p class="small muted">${esc(FORMULA.noacepto)}</p></div>`,
     `<div class="step" data-n="3"><span class="eyebrow">Declara la verdad: ${esc(s.verdad)}</span>
        <div class="card" style="margin-top:8px"><p class="decree">${esc(s.decreto)}</p><div class="vrow">${sayBtn("sit:"+s.id)}</div></div>
        ${s.aviso?`<p class="note" style="margin-top:10px">${esc(s.aviso)}</p>`:""}
        ${s.enumerar?`<label class="f" style="margin-top:12px">Doy gracias por... (escríbelo todo, hasta lo más pequeño)<textarea id="enum" placeholder="El sol de esta mañana, mi familia, mi café, mis manos..."></textarea></label>`:""}
        ${s.recordar?`<label class="f" style="margin-top:12px">Algo bueno de esa persona (no se guarda)<textarea id="enum" placeholder="Un rato agradable, algo que te hizo reír, una cualidad..."></textarea></label>`:""}
        ${s.registra?`<div style="margin-top:12px"><span class="eyebrow">¿Cuál se te escapó?</span><div class="chips" style="flex-wrap:wrap;margin-top:8px">${FRASES_NEGATIVAS.map(f=>`<span class="chip small">${esc(f)}</span>`).join("")}</div></div>`:""}
        ${s.extra.length?`<div class="stack" style="margin-top:14px;gap:10px"><span class="eyebrow">También te ayuda</span>${s.extra.map(e=>`<p class="small" style="padding-left:12px;border-left:3px solid var(--gold)">${esc(e)}</p>`).join("")}</div>`:""}
      </div>`,
     `<div class="step last" data-n="4"><span class="eyebrow">Da las gracias</span><p class="say" style="margin:8px 0;font-size:1.6rem">${THANKS}</p><p class="small muted">${esc(FORMULA.despues)}</p>
       ${!s.registra&&s.id!=="recaida"?`<label class="f" style="margin-top:12px">¿Sobre qué asunto? (opcional, para verlo en “En marcha”)<input type="text" id="asunto" placeholder="la deuda del coche, la espalda..."></label>`:""}</div>`
    ];
    sheet(`<span class="eyebrow">Transformar</span>`,`<div class="stack" style="gap:6px"><h2>${esc(s.titulo)}</h2>
      ${PORQUE[s.id]?`<details class="why" style="margin:6px 0 16px"><summary>¿Por qué funciona?</summary><p>${esc(PORQUE[s.id])}</p></details>`:""}${steps.slice(0,step).join("")}
      ${step<4?`<button class="btn primary full" id="next">Siguiente paso</button>`:`<button class="btn gold full" id="fin">Hecho. Lo dejo obrar.</button>`}</div>`);
    const n=$("#next"); if(n) n.onclick=()=>{step++;draw();setTimeout(()=>{const st=document.querySelectorAll(".step");if(st.length)st[st.length-1].scrollIntoView({behavior:"smooth",block:"start"})},40)};
    const f=$("#fin"); if(f) f.onclick=()=>{const dd=day();dd.trat=(dd.trat||0)+1; if(s.registra){S.neg[TODAY]=(S.neg[TODAY]||0)+1;}
      else if(s.id!=="recaida"){const a=($("#asunto")||{}).value||"";S.curso=S.curso.filter(x=>x.sit!==s.id);S.curso.push({id:Date.now()+"",sit:s.id,t:s.titulo,a:a.trim(),date:TODAY});} save(); closeSheet(); toast(s.registra?"Corregida. Sigue adelante.":"Hecho. No lo comentes; déjalo obrar."); render();};
  };
  draw();
}

TOOLFN.medit=function(){
  let timer=null, t=0, subj="la paz", lock=null, ctx=null;
  const PH=["Aquietar","Elegir","Sentir"];
  const tone=()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=528;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.15,ctx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+1.6);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.7);}catch(e){}};
  const draw=()=>{
    const ph=Math.min(2,Math.floor(t/20)); const left=60-t;
    sheet(`<span class="eyebrow">Silencio</span>`,`<div class="stack-lg" style="text-align:center">
     <h2>Un minuto de silencio</h2>
     <label class="f" style="text-align:left">En qué me centro<select id="subj">${["la paz","el amor","la Presencia de Dios en mí","la salud","la abundancia","la gratitud"].map(o=>`<option ${o===subj?"selected":""}>${o}</option>`).join("")}</select></label>
     <div class="orb ${timer?"breath":""}"><div><div class="n">${timer||t?left:60}</div><div class="small muted">${timer||t?PH[t>=60?2:ph]:"segundos"}</div></div></div>
     <div class="phase">${PH.map((p,i)=>`<i class="${(timer||t)&&i<=(t>=60?2:ph)?"on":""}"></i>`).join("")}</div>
     <p class="small muted" style="text-align:left">${t>=60?"Quédate en esa sensación todo el tiempo que quieras. Cuando vuelvas a tus cosas, llévatela contigo.":
      `Primeros veinte segundos: respira y deja que el cuerpo se afloje. Siguientes veinte: piensa en ${esc(subj)}, solo en eso. Últimos veinte: siéntelo en el pecho, como si ya lo estuvieras viviendo.`}</p>
     ${timer?`<button class="btn full" id="stop">Detener</button>`:`<button class="btn primary full" id="go">${t>=60?"Otra vez":"Empezar"}</button>`}
     <p class="small muted" style="text-align:left">No hace falta un lugar especial ni mucho tiempo. Un minuto de atención completa vale más que una hora distraída.</p></div>`, ()=>{clearInterval(timer);timer=null;try{lock&&lock.release()}catch(e){}});
    $("#subj").onchange=e=>{subj=e.target.value;};
    const go=$("#go"); if(go) go.onclick=async()=>{t=0;tone();try{lock=await navigator.wakeLock.request("screen")}catch(e){}
      timer=setInterval(()=>{t++; if(t%20===0) tone(); if(t>=60){clearInterval(timer);timer=null;const dd=day();if(!dd.done.includes("medit"))dd.done.push("medit");save();} draw();},1000); draw();};
    const st=$("#stop"); if(st) st.onclick=()=>{clearInterval(timer);timer=null;draw();};
  };
  draw();
};

function reduce(n){while(n>9&&n!==11&&n!==22){n=String(n).split("").reduce((a,b)=>a+ +b,0);}return n;}
function letterVal(c){const i="ABCDEFGHIJKLMNOPQRSTUVWXYZ".indexOf(c);return i<0?0:(i%9)+1;}
TOOLFN.numero=function(){
  const caras=v=>{const a=NUMERO.n[v];return `<div class="three" style="margin-top:10px"><p><b>Luz</b> ${esc(a.luz)}</p><p><b>Sombra</b> ${esc(a.sombra)}</p></div>`;};
  const pos=(v,eye,title,expl,key)=>{const a=NUMERO.n[v];return `<div class="npos"><div class="hd"><div class="v">${v}</div><div><span class="eyebrow">${eye}</span><h3>${title} · ${esc(a.e)}</h3></div></div>
     <p class="small muted" style="margin-top:8px">${expl}</p><p style="margin-top:8px">${esc(a[key])}</p>${caras(v)}</div>`;};
  const draw=R=>{
    let res="";
    if(R){
      const p=[pos(R.alma,"Suma de tus vocales","Número del alma","Lo que deseas en lo más hondo.","alma"),
        pos(R.pers,"Suma de tus consonantes","Número de la personalidad","Cómo te ves cuando nadie te mira, y cómo te perciben al principio.","pers"),
        pos(R.expr,"Suma de todas las letras","Número de expresión","Tus talentos naturales y el tipo de trabajo donde te sientes cómoda.","expr")];
      if(R.camino) p.push(pos(R.camino,"Suma de tu fecha de nacimiento","Camino de vida","Lo que vienes a aprender en esta vida.","camino"));
      const hasM=[R.alma,R.pers,R.expr,R.camino].some(v=>v===11||v===22);
      res=`<div class="card">${p.join("")}</div>${hasM?`<p class="note">${esc(NUMERO.maestros)}</p>`:""}`;
    }
    sheet(`<span class="eyebrow">Numerología</span>`,`<div class="stack-lg"><h2>Mis números</h2>
     <p class="note">${esc(NUMERO.intro)}</p>
     <label class="f">Nombre completo, como figura en tu partida de nacimiento<input type="text" id="nm" value="${esc(S.numName||"")}" placeholder="Nombre y apellidos"></label>
     <label class="f">Fecha de nacimiento<input type="date" id="nd" value="${esc(S.numDate||"")}"></label>
     <button class="btn primary" id="calc">Calcular</button>
     ${res}
     ${R?`<p class="small muted">Cómo se calcula: cada letra vale según su posición (A, J, S = 1; B, K, T = 2; C, L, U = 3...). Se suman y se reducen a una cifra, salvo el 11 y el 22. El camino de vida suma el día, el mes y el año de nacimiento.</p>`:""}</div>`);
    $("#calc").onclick=()=>{
      const name=$("#nm").value, date=$("#nd").value; S.numName=name; S.numDate=date; save();
      const letters=name.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/Ñ/g,"N").replace(/[^A-Z]/g,"");
      if(!letters){toast("Escribe tu nombre completo");return;}
      const isV=c=>"AEIOU".includes(c);
      const sum=f=>reduce([...letters].filter(f).reduce((a,c)=>a+letterVal(c),0))||1;
      const R={alma:sum(isV),pers:sum(c=>!isV(c)),expr:sum(()=>true)};
      if(date){const [y,m,d]=date.split("-").map(Number);R.camino=reduce(reduce(m)+reduce(d)+reduce(String(y).split("").reduce((a,b)=>a+ +b,0)));}
      draw(R);
    };
  };
  draw(null);
};

const sayBtn=(src,label)=>`<button class="vbtn play" data-say="${esc(src)}">▶ ${label||"Escuchar"}</button>`;

const hasTTS=()=>"speechSynthesis" in window;
function esVoices(){try{return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));}catch(e){return [];}}
function pickVoice(){const vs=esVoices();return vs.find(v=>v.name===S.voz.voice)||vs.find(v=>/es[-_]ES/i.test(v.lang)&&/(enhanced|mejorad|premium|siri)/i.test(v.name))||vs.find(v=>/es[-_]ES/i.test(v.lang))||vs[0]||null;}
if(hasTTS()){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(sheetKey==="voz")openTool("voz");};}catch(e){}}
const cleanTxt=s=>String(s).replace(/\([^)]*\)/g," ").replace(/[“”"«»*]/g,"").replace(/\s+/g," ").trim();
function chunk(s){const out=[];let cur="";cleanTxt(s).split(/(?<=[.!?;:])\s+/).forEach(p=>{if((cur+" "+p).length>220&&cur){out.push(cur);cur=p;}else cur=cur?cur+" "+p:p;});if(cur)out.push(cur);return out;}
let Q=[],qi=0,speaking=false,paused=false,wl=null,label="",myAudio=null;
function textFor(src){
  const [k,id]=[src.slice(0,src.indexOf(":")),src.slice(src.indexOf(":")+1)];
  if(k==="dec"){const d=D(id);return d?{l:d.t,parts:[d.x]}:null;}
  if(k==="sit"){const s=SITUACIONES.find(x=>x.id===id);return {l:s.titulo,parts:["Esto no es para mí.",s.decreto,THANKS]};}
  if(k==="dia"){const r=DIAS[+id];return {l:r.q,parts:[r.d]};}
  if(k==="rut"){const items=ROUTINE[id]||[];const parts=items.filter(i=>!i.go).map(i=>i.d?D(i.d).x:i.x);return {l:"Rutina de "+id.toLowerCase(),parts};}
  if(k==="txt"){if(id==="tat")return {l:"Ya está en marcha",parts:[FORMULA.yaEnMarcha]};for(const items of Object.values(ROUTINE)){const it=items.find(x=>x.k===id);if(it&&it.x)return {l:it.t,parts:[it.x]};}}
  return null;
}
function speakSrc(src){const r=textFor(src);if(r)speak(r.parts,r.l);}
function speak(parts,l){
  if(!hasTTS()){toast("Este navegador no tiene voz disponible");return;}
  stopSpeak(true);
  Q=[];const rep=S.voz.rep||1;
  for(let r=0;r<rep;r++) parts.forEach(p=>{chunk(p).forEach(c=>Q.push(c));Q.push(null);});
  qi=0;speaking=true;paused=false;label=l+(rep>1?" · "+rep+" veces":"");
  lockScreen();renderPlayer();nextChunk();
}
function nextChunk(){
  if(!speaking||paused) return;
  if(qi>=Q.length){stopSpeak();return;}
  const c=Q[qi++];
  if(c===null){setTimeout(nextChunk,1100);return;}
  const u=new SpeechSynthesisUtterance(c);const v=pickVoice();u.lang=v?v.lang:"es-ES";if(v)u.voice=v;u.rate=S.voz.rate||0.9;u.pitch=1;
  u.onend=()=>{if(speaking&&!paused)nextChunk();};
  u.onerror=()=>{if(speaking&&!paused)nextChunk();};
  speechSynthesis.speak(u);
}
function pauseSpeak(){if(myAudio){myAudio.paused?myAudio.play():myAudio.pause();renderPlayer();return;}
  if(!paused){paused=true;qi=Math.max(0,qi-1);while(qi>0&&Q[qi]===null)qi--;try{speechSynthesis.cancel();}catch(e){}}else{paused=false;nextChunk();}renderPlayer();}
function stopSpeak(silent){speaking=false;paused=false;Q=[];try{speechSynthesis.cancel();}catch(e){}
  if(myAudio){try{myAudio.pause();}catch(e){}myAudio=null;}
  try{wl&&wl.release();}catch(e){}wl=null;if(!silent)renderPlayer();}
async function lockScreen(){try{wl=await navigator.wakeLock.request("screen");}catch(e){}}
function renderPlayer(){
  const p=$("#player"); const on=speaking||!!myAudio;
  p.hidden=!on; if(!on){p.innerHTML="";return;}
  const isPaused=myAudio?myAudio.paused:paused;
  p.innerHTML=`<div class="in"><p>${myAudio?"Tu voz":"Leyendo"} · ${esc(label)}</p><button id="pp">${isPaused?"Seguir":"Pausa"}</button><button id="st">Parar</button></div>`;
  $("#pp").onclick=pauseSpeak; $("#st").onclick=()=>stopSpeak();
}
/* grabaciones propias (IndexedDB, solo en este móvil) */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open("decreta",1);r.onupgradeneeded=()=>r.result.createObjectStore("rec");r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const st=db.transaction("rec",mode).objectStore("rec");const q=fn(st);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  get(k){return this.tx("readonly",s=>s.get(k));},put(k,v){return this.tx("readwrite",s=>s.put(v,k));},del(k){return this.tx("readwrite",s=>s.delete(k));}
};
let recState=null;
async function toggleRec(id){
  if(recState&&recState.id===id){try{recState.mr.stop();}catch(e){}return;}
  if(recState){toast("Ya estás grabando otro decreto");return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Este navegador no permite grabar. Ábrela desde la app instalada o Safari.");return;}
  try{
    stopSpeak();
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const type=MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"";
    const mr=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);
    const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=async()=>{stream.getTracks().forEach(tr=>tr.stop());const blob=new Blob(chunks,{type:mr.mimeType||type||"audio/webm"});recState=null;
      try{await IDB.put(id,blob);if(!S.recs.includes(id))S.recs.push(id);save();toast("Grabado con tu voz");}catch(e){toast("No se pudo guardar la grabación");}
      refreshSheetOrView();};
    recState={id,mr};mr.start();toast("Grabando… lee el decreto en voz alta");refreshSheetOrView();
  }catch(e){recState=null;toast("Necesito permiso para usar el micrófono");}
}
function refreshSheetOrView(){
  // vuelve a pintar los botones de grabación donde estén
  document.querySelectorAll("[data-rec],[data-myplay]").forEach(b=>{const id=b.dataset.rec||b.dataset.myplay;const row=b.parentElement;if(!row)return;
    row.querySelectorAll("[data-rec],[data-myplay],[data-mydel]").forEach(x=>x.remove());row.insertAdjacentHTML("beforeend",recBtns(id));});
}
async function playMine(id){
  try{const blob=await IDB.get(id);if(!blob){toast("No encuentro la grabación");S.recs=S.recs.filter(x=>x!==id);save();return;}
    stopSpeak(true);let n=0;const rep=S.voz.rep||1;const d=D(id);label=(d?d.t:"Mi decreto")+(rep>1?" · "+rep+" veces":"");
    myAudio=new Audio(URL.createObjectURL(blob));
    myAudio.onended=()=>{n++;if(n<rep&&myAudio){setTimeout(()=>{myAudio&&myAudio.play();},1100);}else{myAudio=null;try{wl&&wl.release()}catch(e){}renderPlayer();}};
    lockScreen();await myAudio.play();renderPlayer();
  }catch(e){toast("No se pudo reproducir");}
}
async function delMine(id){try{await IDB.del(id);}catch(e){}S.recs=S.recs.filter(x=>x!==id);save();refreshSheetOrView();toast("Grabación borrada");}

  const mp=t.closest("[data-myplay]"); if(mp){playMine(mp.dataset.myplay);return;}
  const mdl=t.closest("[data-mydel]"); if(mdl){delMine(mdl.dataset.mydel);return;}
  const cg=t.closest("[data-cgr]"); if(cg){toast("Ya está en marcha. Gracias.");return;}
  const cmn=t.closest("[data-cman]"); if(cmn){manifest(cmn.dataset.cman);return;}
  const cop=t.closest("[data-copen]"); if(cop){const c=S.curso.find(x=>x.id===cop.dataset.copen);if(c)showCurso(c);return;}
  if(t.id==="theme"){S.theme=S.theme===""?"dark":S.theme==="dark"?"light":"";S.theme?document.documentElement.setAttribute("data-theme",S.theme):document.documentElement.removeAttribute("data-theme");save();render();}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){decQ=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos);}});

function render(){
  renderTabs();
  $("#app").innerHTML=tab==="hoy"?viewHoy():tab==="acepto"?viewAcepto():tab==="decretos"?viewDecretos():tab==="herr"?viewHerr():viewEstudio();
}
render();
if(!S.nameAsked) TOOLFN.nombre(true);
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
